; Supervisor programs for production (copy to /etc/supervisor/conf.d/app.conf, then `supervisorctl reread && supervisorctl update`).
; Build first: `go build -o go-starter-pack .` Adjust paths and the user. Settings come from the .env next to the binary.

; The website. It also runs a queue worker and the scheduler inside the same process (Goravel runners).
[program:app-web]
command=/var/www/app/go-starter-pack
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/app/web.log
redirect_stderr=true

; Extra queue workers for busy queues (Laravel's queue:work). One program per group of queues.
[program:app-queue-worker]
command=/var/www/app/go-starter-pack artisan queue:work --queue=default --tries=3
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/app/queue-worker.log
redirect_stderr=true
